name: Android APK – GLITCH RADAR
on:
  push:
    branches: [main]
    paths: ['mobile/**', 'public/icon.svg', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Check installed Android SDK
        run: test -d "$ANDROID_HOME/platforms" && ls "$ANDROID_HOME/platforms"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate app icons
        run: npm run assets
      - name: Type-check native code
        run: npm run typecheck
      - name: Prebuild native Android sources
        run: npx expo prebuild --platform android --no-install --clean
      - name: Diagnose Expo native modules
        run: |
          npm ls expo expo-modules-autolinking expo-modules-core || true
          npx expo-modules-autolinking resolve --platform android --json > /tmp/glitch-autolinking.json || true
          node -e "const fs=require('fs');try { const d=JSON.parse(fs.readFileSync('/tmp/glitch-autolinking.json','utf8')); console.log('Resolved Expo native projects:', JSON.stringify(d.modules?.map((x,i)=>({i,name:x.packageName||x.name,projects:x.projects?.map(p=>({name:p.name,publication:p.publication}))})),null,2)) }catch(e){console.log('Expo module diagnostic unavailable:',e.message)}"
      - name: Compile installable APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon
      - name: Copy artifact
        run: cp android/app/build/outputs/apk/release/*.apk GLITCH-RADAR.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GLITCH-RADAR-Android-APK
          path: mobile/GLITCH-RADAR.apk
          if-no-files-found: error
          retention-days: 30
